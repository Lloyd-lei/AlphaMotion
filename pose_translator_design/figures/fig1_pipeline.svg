<text x="642.0" y="330" font-size="12" text-anchor="middle" fill="white" font-weight="bold" font-style="normal">8</text>
<text x="625.0" y="380" font-size="11.8" text-anchor="middle" fill="#4b5563" font-weight="normal" font-style="normal">FSQ 量化压缩成离散码</text>
<text x="625.0" y="397" font-size="11.8" text-anchor="middle" fill="#4b5563" font-weight="normal" font-style="normal">（这一层不装几何量，只装</text>
<text x="625.0" y="414" font-size="11.8" text-anchor="middle" fill="#4b5563" font-weight="normal" font-style="normal">“这一帧大致在做什么”）</text>
