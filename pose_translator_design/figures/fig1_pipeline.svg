<text x="125" y="447" font-size="12.5" text-anchor="middle" fill="#4b5563" font-weight="normal" font-style="normal">（人 / 动物 / 任意拓扑）</text>
<line x1="230" y1="300" x2="260" y2="300" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="260" y="210" width="210" height="180" rx="14" ry="14" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/>
<text x="365.0" y="245" font-size="17" text-anchor="middle" fill="#4338ca" font-weight="bold" font-style="normal">① 共享编码器</text>
<text x="365.0" y="268" font-size="12.5" text-anchor="middle" fill="#4b5563" font-weight="normal" font-style="italic">Graph Transformer</text>
<text x="365.0" y="300" font-size="12.5" text-anchor="middle" fill="#4b5563" font-weight="normal" font-style="normal">每个关节看自己的方向、</text>
<text x="365.0" y="317" font-size="12.5" text-anchor="middle" fill="#4b5563" font-weight="normal" font-style="normal">骨长比例、名字语义，</text>
<text x="365.0" y="334" font-size="12.5" text-anchor="middle" fill="#4b5563" font-weight="normal" font-style="normal">还会参考骨架的连接</text>
<text x="365.0" y="351" font-size="12.5" text-anchor="middle" fill="#4b5563" font-weight="normal" font-style="normal">关系（谁是谁的父节点）</text>
<text x="365.0" y="372" font-size="12" text-anchor="middle" fill="#4338ca" font-weight="bold" font-style="normal">→ 关节数可变，不挑骨架</text>
<line x1="470" y1="300" x2="510" y2="300" stroke="#374151" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="510" y="190" width="230" height="220" rx="14" ry="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
<text x="625.0" y="220" font-size="16" text-anchor="middle" fill="#7c3aed" font-weight="bold" font-style="normal">② 摘要成 K=8 个 token</text>
<text x="625.0" y="240" font-size="12" text-anchor="middle" fill="#4b5563" font-weight="normal" font-style="normal">跟骨架种类完全无关</text>
