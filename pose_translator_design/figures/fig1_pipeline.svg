<text x="950.0" y="203" font-size="12" text-anchor="middle" fill="#4b5563" font-weight="normal" font-style="italic">（类似 AlphaFold 的做法）</text>
<rect x="805" y="222" width="290" height="70" rx="10" ry="10" fill="white" stroke="#0e7490" stroke-width="1.5"/>
<text x="950.0" y="245" font-size="12.3" text-anchor="middle" fill="#4b5563" font-weight="normal" font-style="normal">每一步：目标骨架的关节互相</text>
<text x="950.0" y="262" font-size="12.3" text-anchor="middle" fill="#4b5563" font-weight="normal" font-style="normal">“看一眼”，一起把姿态往前调一点</text>
<path d="M 1085 300 Q 950.0 346.0 815 300" fill="none" stroke="#0e7490" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
<text x="950.0" y="340" font-size="12" text-anchor="middle" fill="#0e7490" font-weight="bold" font-style="normal">重复 L 次（约 4～8 步）</text>
<rect x="805" y="362" width="290" height="82" rx="10" ry="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="950.0" y="386" font-size="12" text-anchor="middle" fill="#9a3412" font-weight="normal" font-style="normal">如果某个关节被指定了精确位置</text>
<text x="950.0" y="403" font-size="12" text-anchor="middle" fill="#9a3412" font-weight="normal" font-style="normal">或角度：每一步都强制把它按</text>
<text x="950.0" y="420" font-size="12" text-anchor="middle" fill="#9a3412" font-weight="normal" font-style="normal">目标数值覆写，再让别的关节响应</text>
<text x="950.0" y="462" font-size="11.5" text-anchor="middle" fill="#4b5563" font-weight="normal" font-style="normal">旋转是唯一学习量，位置由骨长+旋转</text>
<text x="950.0" y="478" font-size="11.5" text-anchor="middle" fill="#4b5563" font-weight="normal" font-style="normal">算出来（骨长永远对，不用单独约束）</text>
