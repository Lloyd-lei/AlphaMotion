obs:
  use_obs_filter: true
  root_height_obs: true
  obs_dict:
    actor_obs:
    - base_ang_vel
    - projected_gravity
    - dof_pos
    - dof_vel
    - actions
    - history_actor
    - max_local_self
    critic_obs:
    - max_local_self
  obs_auxiliary:
    history_actor:
      base_ang_vel: 4
      projected_gravity: 4
      dof_pos: 4
      dof_vel: 4
      actions: 4
  obs_scales:
    actions: 1.0
    dof_pos: 1.0
    dof_vel: 1.0
